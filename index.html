<!doctype html>
<html lang="en" data-theme="light" data-segment="retail">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <meta name="description" content="Your Meridian accounts, recent transactions, and transfers in one place." />
    <title>Meridian Banking</title>
    <script>
      ;(() => {
        let theme, segment
        try {
          theme = localStorage.getItem('meridian-theme')
          segment = localStorage.getItem('meridian-segment')
        } catch {}
        document.documentElement.dataset.theme =
          theme === 'dark' || theme === 'light'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.segment = segment === 'premium' ? 'premium' : 'retail'
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
